# ===============================
# Application Config
# ===============================
spring.application.name=Restaurant-Recommendation-System

# ===============================
# Database Config (MySQL)
# ===============================
spring.datasource.url=jdbc:mysql://localhost:3306/restaurant_db?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=abc14250
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ===============================
# JPA / Hibernate Config
# ===============================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL8Dialect

# ===============================
# SQL Init Config
# ===============================
spring.sql.init.mode=never

# ===============================
# Spring AI / OpenAI Config
# Replace with your OpenAI API Key
# ===============================
spring.ai.openai.api-key=${OPENAI_API_KEY:ms-38924a12-d34f-46b4-85b0-10ad8ad3c09e}
spring.ai.openai.base-url=https://api-inference.modelscope.cn
spring.ai.openai.chat.options.model=Qwen/Qwen3.5-27B
spring.ai.openai.chat.options.temperature=0.7

# Rate limiting config
spring.ai.retry.max-attempts=3
spring.ai.retry.backoff.initial-interval=2000
spring.ai.retry.backoff.multiplier=2
spring.ai.retry.backoff.max-interval=10000

# ===============================
# Server Config
# ===============================
server.port=8080

# ===============================
# Logging Config
# ===============================
logging.level.com.example.aispring=INFO
logging.level.org.springframework.ai=DEBUG
